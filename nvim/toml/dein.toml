[[plugins]]
repo = 'folke/snacks.nvim'

[[plugins]]
repo = 'coder/claudecode.nvim'
depends = ['snacks.nvim']
hook_add = '''
lua << EOF
require("claudecode").setup({
  terminal = {
    provider = "snacks", -- Use snacks.nvim for a polished terminal UI
    -- split_side / split_width_percentage / git_repo_cwd はいずれも terminal 配下。
    -- トップレベルに置くと検証もされず黙って捨てられ、既定値が使われる
    split_side = "right",
    split_width_percentage = 0.35,
    git_repo_cwd = true,
  },
  track_selection = true,
  diff_opts = {
    open_in_new_tab = true,
  },
})
-- Keymaps live in ~/.config/nvim/lua/keymap/keymap.lua
EOF
'''
